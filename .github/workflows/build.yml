name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-2025
    steps:
      - name: Configure git
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-packer@v3
      - name: Set up msys2
        uses: msys2/setup-msys2@v2
        with:
          install: make tar zip unzip mingw-w64-x86_64-jq
          path-type: inherit
      - name: Install PowerShell test tools
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Scope CurrentUser -Force
      - name: Install Pester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Install Go tools
        run: msys2 -c 'make init'
      - name: Check generated configuration
        run: msys2 -c 'make generate-check'
      - name: Check
        run: msys2 -c 'make check'
      - name: Build snapshot artifacts
        run: msys2 -c 'make release-snapshot'
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: dist/
          if-no-files-found: error
